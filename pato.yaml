apiVersion: apps/v1
kind: Deployment
metadata:
  name: pato
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pato
  template:
    metadata:
      labels:
        app: pato
    spec:
      containers:
      - name: pato
        image: nginx:stable
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80


---
apiVersion: v1
kind: Service
metadata:
  name: pato-service
spec:
  type: LoadBalancer
  selector:
    app: pato
  ports:
  - port: 8099
    targetPort: 80

