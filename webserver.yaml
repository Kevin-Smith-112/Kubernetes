apiVersion: v1
kind: Pod
metadata:
  name: web1
  labels:
    app.kubernetes.io/name: web1
spec:
  containers:
  - name: nginx
    image: nginx:stable
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
    ports:
      - containerPort: 8111
